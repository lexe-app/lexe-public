[doc.extern-map.registries]
# Allows `cargo doc` to generate links to external documentation for crates
# sourced from crates.io that don't have the `html_root_url` doc attribute defined.
# See the `rustdoc-map` Cargo feature for more details:
# <https://doc.rust-lang.org/nightly/cargo/reference/unstable.html#rustdoc-map>
crates-io = "https://docs.rs/"

[env]
# Don't persist proptest-regressions/ seed files, since a failing case is
# reproducible from the seed printed in the test output.
PROPTEST_DISABLE_FAILURE_PERSISTENCE = "1"

[target.'cfg(target_env = "sgx")']
# Use our custom SGX runner
runner = "run-sgx-cargo"

# NOTE(phlip9): This was too aggressive for our cheaper dev VMs. We'll just
# enable these flags manually for prod-relevant build artifacts.
#
# # Might as well do the same for everything else. `vaes` is too aggressive
# # (Ice Lake 2021+) to mandate outside of our enclaves.
# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-Ctarget-cpu=x86-64-v3", "-Ctarget-feature=+adx,+aes,+pclmulqdq,+sha"]
