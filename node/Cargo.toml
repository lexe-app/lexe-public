[package]
name = "node"
version = "0.10.2"
license = "PolyForm-Noncommercial-1.0.0"
authors = { workspace = true }
edition = { workspace = true }
publish = false

[lints]
workspace = true

[features]
# Explicitly specify that no features should be enabled by default.
default = []
# Enables various test hooks and utilities. Should be disabled in staging/prod.
test-utils = [
    "lexe-common/test-utils",
    "lexe-crypto/test-utils",
    "lexe-enclave/test-utils",
    "lexe-ln/test-utils",
]

[package.metadata.fortanix-sgx]
# When true, return panics w/ backtraces to the host via the shared "debug
# buffer". We need this to debug panics in prod. rust-std also currently saves
# some registers so a debugger can reconstruct the stack.
# NOTE: this is not the same as the SGX platform DEBUG mode, which disables all
# memory protections.
# TODO(phlip9): patch rust-std so it always saves panics w/ backtraces but only
# dumps registers if `debug = true`.
debug = true
# Heap size in bytes. Default: 0x200_0000.
#
# (2026-08-13): Sized to `DEFAULT_MEGANODE_MEMORY_OVERHEAD` + a reasonable
# number of usernodes, with enough room to survive the network graph channel
# map's next HashMap doubling (65536 -> 131072 buckets once the graph exceeds
# ~57344 channels), whose post-doubling init peak we estimate at ~215 MiB:
#
# - Prod: max_heap_mib=138.6 (during init, 0 users);
#   fixed_heap_mib=93.7 stable; heap_mib=103.8 with 4 users running.
# - Memory profiling: the in-memory graph is 86.6 MiB and 158.6 MiB with a
#   doubled channel map (only the bucket table doubles: +72 MiB).
# - Deserialize peak = in-memory graph + one serialized copy (~48.5 MiB);
#   profiled at 208 MiB with doubled map capacity, matching this model.
# - 208 + ~4 (serialized bytes grown to the doubling threshold)
#   + ~3 (non-graph init) => ~215 MiB init peak; ~170 MiB stable.
#
# 288 MiB leaves ~73 MiB of margin over that peak in case some unanticipated
# thing starts using a bunch of memory.
#
# Current: 288 MiB
heap-size = 0x1200_0000
# SSA frame size (in pages) for each thread. Default: 1.
# You normally don't need to change the SSA frame size.
ssaframesize = 1
# Stack size (in bytes) for each thread. Default: 0x2_0000.
# Current: 8MiB
stack-size = 0x80_0000
# The max number of threads we can spawn concurrently inside the SGX enclave.
#
# NOTE: ideally this value should be "threads=1", however, the current fortanix
#       rust-sgx `async_usercalls` implementation requires an extra thread, so
#       until that changes, we're stuck with "threads=2".
#       see: https://github.com/lexe-app/rust-sgx/blob/70d11205fed08e49886bb25a1ea3df19928e8287/async-usercalls/src/queues.rs#L46
threads = 2

[dependencies]

# --- LEXE --- #

gdrive = { path = "../gdrive" }
lexe-api = { workspace = true }
lexe-byte-array = { workspace = true }
lexe-common = { workspace = true }
lexe-crypto = { workspace = true }
lexe-enclave = { workspace = true }
lexe-hex = { workspace = true }
lexe-ln = { path = "../lexe-ln" }
lexe-std = { workspace = true }
lexe-tls = { workspace = true }
lexe-tls-attest-server = { path = "../lexe-tls-attest-server" }
lexe-tokio = { workspace = true }

# --- WORKSPACE --- #

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bitcoin = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
lightning = { workspace = true }
lightning-transaction-sync = { workspace = true }
lru = { workspace = true }
nostr = { workspace = true }
quick_cache = { workspace = true }
ref-cast = { workspace = true }
secrecy = { workspace = true }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time"
] }
tower = { workspace = true, features = ["util"] } 
tracing = { workspace = true }

[dev-dependencies]
lexe-common = { workspace = true, features = ["test-utils"] }
lexe-crypto = { workspace = true, features = ["test-utils"] }
lexe-ln = { path = "../lexe-ln", features = ["test-utils"] }

proptest = { workspace = true, features = ["alloc"] }
proptest-derive = { workspace = true }
# Tokio features used when testing
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "rt",
    "sync",
    "test-util", # Used to pause time in inactivity_timer::tests
    "time"
] }
