[package]
name = "lexe-logger"
version = "0.1.27"
license = "MIT"
description = "Lexe tracing primitives and logger configuration"
documentation = "https://docs.rs/lexe-logger"
authors = { workspace = true }
edition = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
publish = true

[lints]
workspace = true

[features]
default = []
# Enables various test hooks and utilities. Should be disabled in staging/prod.
test-utils = ["dep:proptest"]

[dependencies]

# --- WORKSPACE --- #

anyhow = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    # Enable colored log outputs
    "ansi",
    "fmt",
    "registry",
    "std",
    "tracing-log",
] }

# --- OPTIONAL --- #
# These must have `optional = true` to prevent infecting production binaries.

proptest = { optional = true, workspace = true, features = ["alloc"] }

[dev-dependencies]
proptest = { workspace = true, features = ["alloc"] }
